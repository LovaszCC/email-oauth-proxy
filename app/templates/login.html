{% extends "base.html" %}
{% from "_ui.html" import icon %}
{% block title %}Log in – Email OAuth2 Proxy{% endblock %}
{% block auth %}
<div class="auth-card card">
  <div class="card-header" style="text-align:center">
    <span class="brand-mark" style="margin:0 auto 0.75rem">{{ icon("mail") }}</span>
    <h2>Email OAuth2 Proxy</h2>
    <p>Sign in to manage accounts</p>
  </div>
  <div class="card-body">
    {% if error %}<div class="alert alert-destructive" style="margin-bottom:1rem">{{ icon("alert") }}<span>{{ error }}</span></div>{% endif %}
    <form method="post" action="/login">
      <div class="field">
        <label class="label" for="username">Username</label>
        <input class="input" id="username" type="text" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label class="label" for="password">Password</label>
        <input class="input" id="password" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit" style="margin-top:1.25rem">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
